<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1724">
  <title>NZ METAR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="airport-nav" aria-label="Airport selector">
    <button class="nav-arrow" id="prevAirports" type="button" aria-label="Previous airports" title="Previous airports">‹</button>
    <div class="tabs" id="airportTabs">
      <button class="tab active" id="tab-nzwn" type="button" data-airport="NZWN" aria-pressed="true">NZWN</button>
      <button class="tab" id="tab-nzaa" type="button" data-airport="NZAA" aria-pressed="false">NZAA</button>
      <button class="tab" id="tab-nzch" type="button" data-airport="NZCH" aria-pressed="false" hidden>NZCH</button>
    </div>
    <button class="nav-arrow" id="nextAirports" type="button" aria-label="Next airports" title="Next airports">›</button>
  </nav>
  <main class="card">
    <header class="header">
      <div class="title">✈️ NZWN METAR</div>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </header>
    <section class="raw-section">
      <label for="rawMetar">Raw METAR</label>
      <pre class="raw" id="rawMetar">—</pre>
    </section>
    <section class="decoded-section">
      <h3>Decoded Summary</h3>
      <div class="decoded" id="decodedContent"></div>
    </section>
    <footer class="footer">
      <div class="issued" id="issuedTime"></div>
      <div class="updated" id="lastUpdated"></div>
      <div class="small" id="sourceInfo"></div>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
