<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="airport-search">
    <label class="search-label" for="airportSearch">Search airports</label>
    <div class="search-box">
      <input
        id="airportSearch"
        type="search"
        placeholder="ICAO, IATA, city or airport name…"
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="airportSearchResults"
        aria-expanded="false"
      >
    </div>
    <div id="airportSearchResults" class="search-results" role="listbox" aria-label="Airport search results" hidden></div>
  </div>

  <div class="airport-selector" aria-label="Airport selector">
    <button class="nav-arrow" id="prevAirports" type="button" aria-label="Previous airports" title="Previous airports">
      <span aria-hidden="true">‹</span>
    </button>
    <div class="tabs-viewport">
      <div class="tabs" id="tabTrack"></div>
    </div>
    <button class="nav-arrow" id="nextAirports" type="button" aria-label="Next airports" title="Next airports">
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <div class="card">
    <div class="header">
      <div class="title">✈️ NZWN METAR</div>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div class="raw-section">
      <label>Raw METAR</label>
      <pre class="raw" id="rawMetar">—</pre>
    </div>
    <div class="decoded-section">
      <h3>Decoded Summary</h3>
      <div class="decoded" id="decodedContent"></div>
    </div>
    <div class="footer">
      <div class="issued" id="issuedTime"></div>
      <div class="updated" id="lastUpdated"></div>
      <div class="small" id="sourceInfo"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
